name: collect-us-stocks
on:
  schedule:
    - cron: "40 22 * * 1-5"     # 美东 18:40（夏令时）/ 17:40（冬令时），收盘后
    - cron: "30 2 * * 2-6"      # 美东 22:30 / 21:30 再补一次，防止数据源更新晚
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-us
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests yfinance
      - run: python collect_us.py
      - name: commit
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git pull --rebase -q || true
          git add data
          git diff --cached --quiet && echo "no change" || (git commit -m "us data $(date -u +%FT%H:%MZ)" && git push)
