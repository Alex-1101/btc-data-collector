name: collect-btc-data
on:
  schedule:
    - cron: "*/10 * * * *"      # 每 10 分钟（GitHub 会有几分钟延迟，分钟线窗口 12 小时，足够覆盖）
  workflow_dispatch:            # 也可以手动点一下跑
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python collect.py
      - name: commit
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "no change" || (git commit -m "data $(date -u +%FT%H:%MZ)" && git push)
